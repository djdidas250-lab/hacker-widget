name: Animated Matrix Widget
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - name: Build
        run: |
          mkdir -p app/src/main/{res/{xml,layout,drawable,anim},java/com/example/hackerwidget}
          python3 -c '
          L,G,Q,a=chr(60),chr(62),chr(34),chr(97)+"ndroid"
          ns=f"xmlns:{a}={Q}http://schemas.{a}.com/apk/res/{a}{Q}"
          w=lambda p,s:open(p,"w").write(s.replace("@A@",a+":").replace("@a@",a))
          w("settings.gradle","pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name = \"MatrixWidget\"\ninclude \":app\"")
          w("build.gradle","plugins{id \"com.@a@.application\" version \"8.2.2\" apply false;id \"org.jetbrains.kotlin.@a@\" version \"1.9.22\" apply false}")
          w("app/build.gradle","plugins{id \"com.@a@.application\";id \"org.jetbrains.kotlin.@a@\"}\n@a@{namespace \"com.example.hackerwidget\";compileSdk 34;defaultConfig{applicationId \"com.example.hackerwidget\";minSdk 26;targetSdk 34;versionCode 1;versionName \"1.0\"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget=\"17\"}}")
          w("app/src/main/AndroidManifest.xml",f"{L}manifest {ns}{G}{L}application @A@label={Q}Entering the Matrix{Q}{G}{L}receiver @A@name={Q}.HackerWidgetProvider{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.appwidget.action.APPWIDGET_UPDATE{Q}/{G}{L}/intent-filter{G}{L}meta-data @A@name={Q}@a@.appwidget.provider{Q} @A@resource={Q}@xml/info{Q}/{G}{L}/receiver{G}{L}/application{G}{L}/manifest{G}")
          w("app/src/main/res/drawable/bg.xml",f"{L}layer-list {ns}{G}{L}item{G}{L}shape @A@shape={Q}rectangle{Q}{G}{L}solid @A@color={Q}#FA010401{Q}/{G}{L}stroke @A@width={Q}2dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}item @A@top={Q}4dp{Q} @A@bottom={Q}4dp{Q} @A@left={Q}4dp{Q} @A@right={Q}4dp{Q}{G}{L}shape @A@shape={Q}rectangle{Q}{G}{L}solid @A@color={Q}#00000000{Q}/{G}{L}stroke @A@width={Q}1dp{Q} @A@color={Q}#5500FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}")
          w("app/src/main/res/drawable/pbox.xml",f"{L}shape {ns} @A@shape={Q}rectangle{Q}{G}{L}solid @A@color={Q}#E6030A03{Q}/{G}{L}stroke @A@width={Q}1dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}")
          w("app/src/main/res/drawable/bar.xml",f"{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}rectangle{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#00FF41{Q} @A@centerColor={Q}#FFFFFF{Q} @A@endColor={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}")
          w("app/src/main/res/drawable/ring1.xml",f"{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}ring{Q} @A@innerRadiusRatio={Q}2.3{Q} @A@thicknessRatio={Q}14{Q} @A@useLevel={Q}false{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#0000FF41{Q} @A@centerColor={Q}#00FF41{Q} @A@endColor={Q}#FFFFFF{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}")
          w("app/src/main/res/drawable/ring2.xml",f"{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}ring{Q} @A@innerRadiusRatio={Q}3.8{Q} @A@thicknessRatio={Q}14{Q} @A@useLevel={Q}false{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#FFFFFF{Q} @A@centerColor={Q}#008F11{Q} @A@endColor={Q}#0000FF41{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}")
          w("app/src/main/res/anim/in_up.xml",f"{L}set {ns} @A@duration={Q}180{Q}{G}{L}translate @A@fromYDelta={Q}100%{Q} @A@toYDelta={Q}0%{Q}/{G}{L}alpha @A@fromAlpha={Q}0.0{Q} @A@toAlpha={Q}1.0{Q}/{G}{L}/set{G}")
