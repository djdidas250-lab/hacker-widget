name: Matrix Dual Widgets
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Base
        run: |
          mkdir -p app/src/main/{res/{xml,layout,drawable,anim},java/com/example/hackerwidget}
          python3 - << 'EOF'
          a=chr(97)+"ndroid"
          L,G,Q=chr(60),chr(62),chr(34)
          ns=f'xmlns:{a}={Q}http://schemas.{a}.com/apk/res/{a}{Q}'
          w=lambda p,s:open(p,"w").write(s.replace("@A@",a+":").replace("@a@",a))
          w("settings.gradle",'pluginManagement{repositories{google();mavenCentral()}}\ndependencyResolutionManagement{repositories{google();mavenCentral()}}\nrootProject.name="MatrixWidget"\ninclude ":app"')
          w("build.gradle",'plugins{id "com.@a@.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.@a@" version "1.9.22" apply false}')
          w("app/build.gradle",'plugins{id "com.@a@.application";id "org.jetbrains.kotlin.@a@"}\n@a@{namespace "com.example.hackerwidget";compileSdk 34;defaultConfig{applicationId "com.example.hackerwidget";minSdk 26;targetSdk 34;versionCode 28;versionName "28.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}}')
          w("app/src/main/AndroidManifest.xml",f'{L}manifest {ns}{G}{L}uses-permission @A@name={Q}@a@.permission.INTERNET{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.ACCESS_NETWORK_STATE{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.ACCESS_COARSE_LOCATION{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.FOREGROUND_SERVICE{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.FOREGROUND_SERVICE_DATA_SYNC{Q}/{G}{L}application @A@label={Q}Entering the Matrix{Q} @A@usesCleartextTraffic={Q}true{Q}{G}{L}activity @A@name={Q}.SyncActivity{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.intent.action.MAIN{Q}/{G}{L}category @A@name={Q}@a@.intent.category.LAUNCHER{Q}/{G}{L}/intent-filter{G}{L}/activity{G}{L}service @A@name={Q}.SyncService{Q} @A@exported={Q}false{Q} @A@foregroundServiceType={Q}dataSync{Q}/{G}{L}receiver @A@name={Q}.HackerWidgetProvider{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.appwidget.action.APPWIDGET_UPDATE{Q}/{G}{L}/intent-filter{G}{L}meta-data @A@name={Q}@a@.appwidget.provider{Q} @A@resource={Q}@xml/info{Q}/{G}{L}/receiver{G}{L}receiver @A@name={Q}.ClockWeatherProvider{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.appwidget.action.APPWIDGET_UPDATE{Q}/{G}{L}action @A@name={Q}com.example.hackerwidget.REFRESH_CW{Q}/{G}{L}/intent-filter{G}{L}meta-data @A@name={Q}@a@.appwidget.provider{Q} @A@resource={Q}@xml/cw_info{Q}/{G}{L}/receiver{G}{L}/application{G}{L}/manifest{G}')
          w("app/src/main/res/drawable/bg.xml",f'{L}layer-list {ns}{G}{L}item @A@top={Q}8dp{Q} @A@bottom={Q}8dp{Q} @A@left={Q}8dp{Q} @A@right={Q}8dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#FA010401{Q}/{G}{L}stroke @A@width={Q}2dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}item @A@top={Q}12dp{Q} @A@bottom={Q}12dp{Q} @A@left={Q}12dp{Q} @A@right={Q}12dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#00000000{Q}/{G}{L}stroke @A@width={Q}1dp{Q} @A@color={Q}#6600FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/bg_off.xml",f'{L}layer-list {ns}{G}{L}item @A@top={Q}8dp{Q} @A@bottom={Q}8dp{Q} @A@left={Q}8dp{Q} @A@right={Q}8dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#FA010401{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/sbg.xml",f'{L}layer-list {ns}{G}{L}item @A@top={Q}4dp{Q} @A@bottom={Q}4dp{Q} @A@left={Q}4dp{Q} @A@right={Q}4dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#00000000{Q}/{G}{L}stroke @A@width={Q}2dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/sbg_off.xml",f'{L}layer-list {ns}{G}{L}item @A@top={Q}4dp{Q} @A@bottom={Q}4dp{Q} @A@left={Q}4dp{Q} @A@right={Q}4dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#00000000{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/ring.xml",f'{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}ring{Q} @A@innerRadiusRatio={Q}2.5{Q} @A@thicknessRatio={Q}12{Q} @A@useLevel={Q}false{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#0000FF41{Q} @A@centerColor={Q}#00FF41{Q} @A@endColor={Q}#FFFFFF{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}')
          w("app/src/main/res/drawable/bar.xml",f'{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}ring{Q} @A@innerRadiusRatio={Q}2.5{Q} @A@thicknessRatio={Q}12{Q} @A@useLevel={Q}false{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#00FF41{Q} @A@centerColor={Q}#FFFFFF{Q} @A@endColor={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}')
          w("app/src/main/res/anim/in_u.xml",f'{L}translate {ns} @A@duration={Q}180{Q} @A@fromYDelta={Q}100%{Q} @A@toYDelta={Q}0%{Q}/{G}')
          w("app/src/main/res/anim/out_u.xml",f'{L}translate {ns} @A@duration={Q}180{Q} @A@fromYDelta={Q}0%{Q} @A@toYDelta={Q}-100%{Q}/{G}')
          w("app/src/main/res/xml/info.xml",f'{L}appwidget-provider {ns} @A@minWidth={Q}180dp{Q} @A@minHeight={Q}180dp{Q} @A@updatePeriodMillis={Q}1800000{Q} @A@initialLayout={Q}@layout/widget{Q} @A@resizeMode={Q}horizontal|vertical{Q} @A@widgetCategory={Q}home_screen{Q}/{G}')
          w("app/src/main/res/xml/cw_info.xml",f'{L}appwidget-provider {ns} @A@minWidth={Q}220dp{Q} @A@minHeight={Q}70dp{Q} @A@updatePeriodMillis={Q}1800000{Q} @A@initialLayout={Q}@layout/cw_widget{Q} @A@resizeMode={Q}horizontal|vertical{Q} @A@widgetCategory={Q}home_screen{Q}/{G}')
          EOF
      - name: Write Layouts & Terminal
        run: |
          python3 - << 'EOF'
          a=chr(97)+"ndroid"
          L,G,Q=chr(60),chr(62),chr(34)
          ns=f'xmlns:{a}={Q}http://schemas.{a}.com/apk/res/{a}{Q}'
          pcts="".join([f'{L}TextView @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@gravity={Q}center{Q} @A@text={Q}System initialization... {v}%{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}8.5sp{Q}/{G}' for v in ["08","19","34","51","68","83","94","100"]])
          tvs="".join([f'{L}TextView @A@id={Q}@+id/p{i}{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@fontFamily={Q}monospace{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}8.8sp{Q}/{G}' for i in range(1,7)])
          w=lambda p,s:open(p,"w").write(s.replace("@A@",a+":").replace("@a@",a))
          w("app/src/main/res/layout/widget.xml",f'{L}LinearLayout {ns} @A@id={Q}@+id/root{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@background={Q}@drawable/bg{Q} @A@orientation={Q}vertical{Q} @A@padding={Q}17dp{Q}{G}{L}LinearLayout @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@gravity={Q}center_vertical{Q}{G}{L}ProgressBar @A@layout_width={Q}22dp{Q} @A@layout_height={Q}22dp{Q} @A@indeterminateDrawable={Q}@drawable/ring{Q}/{G}{L}TextView @A@layout_width={Q}0dp{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_weight={Q}1{Q} @A@layout_marginStart={Q}7dp{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}┌ Entering the Matrix ┐{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}11.5sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}TextView @A@id={Q}@+id/gear_t{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@paddingStart={Q}6dp{Q} @A@text={Q}⚙{Q} @A@textColor={Q}#8800FF41{Q} @A@textSize={Q}13sp{Q}/{G}{L}/LinearLayout{G}{L}ViewFlipper @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginTop={Q}3dp{Q} @A@autoStart={Q}true{Q} @A@flipInterval={Q}300{Q}{G}{pcts}{L}/ViewFlipper{G}{L}ProgressBar @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}5dp{Q} @A@layout_marginTop={Q}2dp{Q} @A@indeterminateDrawable={Q}@drawable/bar{Q}/{G}{L}ViewFlipper @A@id={Q}@+id/f{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}0dp{Q} @A@layout_weight={Q}1{Q} @A@layout_marginTop={Q}4dp{Q} @A@autoStart={Q}true{Q} @A@flipInterval={Q}1750{Q} @A@inAnimation={Q}@anim/in_u{Q} @A@outAnimation={Q}@anim/out_u{Q}{G}{tvs}{L}/ViewFlipper{G}{L}TextView @A@id={Q}@+id/foot{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginTop={Q}2dp{Q} @A@fontFamily={Q}monospace{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}8sp{Q}/{G}{L}/LinearLayout{G}')
          w("app/src/main/res/layout/cw_widget.xml",f'{L}LinearLayout {ns} @A@id={Q}@+id/cw_root{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@background={Q}@drawable/sbg{Q} @A@orientation={Q}horizontal{Q} @A@gravity={Q}center_vertical{Q} @A@padding={Q}12dp{Q}{G}{L}LinearLayout @A@layout_width={Q}0dp{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_weight={Q}1.2{Q} @A@orientation={Q}vertical{Q}{G}{L}TextView @A@id={Q}@+id/w_loc{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}Fort Erie{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}10sp{Q}/{G}{L}TextClock @A@id={Q}@+id/w_time{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@format12Hour={Q}hh:mm{Q} @A@format24Hour={Q}HH:mm{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}28sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}TextClock @A@id={Q}@+id/w_date{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@format12Hour={Q}EEEE, MMMM dd{Q} @A@format24Hour={Q}EEEE, MMMM dd{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}9.5sp{Q}/{G}{L}/LinearLayout{G}{L}LinearLayout @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@orientation={Q}vertical{Q} @A@gravity={Q}end{Q}{G}{L}LinearLayout @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@orientation={Q}horizontal{Q} @A@gravity={Q}center_vertical{Q}{G}{L}TextView @A@id={Q}@+id/w_top{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}--° ☁{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}24sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}TextView @A@id={Q}@+id/gear_w{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@paddingStart={Q}6dp{Q} @A@text={Q}⚙{Q} @A@textColor={Q}#8800FF41{Q} @A@textSize={Q}12sp{Q}/{G}{L}/LinearLayout{G}{L}TextView @A@id={Q}@+id/w_sub{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}Tap to sync ≋ --°{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}9.5sp{Q}/{G}{L}/LinearLayout{G}{L}/LinearLayout{G}')
          w("app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.appwidget.*;import @a@.content.*;import @a@.graphics.Color;import @a@.text.*;import @a@.text.style.ForegroundColorSpan;import @a@.view.View;import @a@.widget.RemoteViews;import java.text.SimpleDateFormat;import java.util.*;import kotlin.random.Random\nclass HackerWidgetProvider:AppWidgetProvider(){private fun hi(s:String,w:List<String>):SpannableString{val sp=SpannableString(s);w.forEach{k->val i=s.indexOf(k);if(i>=0)sp.setSpan(ForegroundColorSpan(Color.WHITE),i,i+k.length,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)};return sp}\noverride fun onUpdate(c:Context,m:AppWidgetManager,ids:IntArray){val sp=c.getSharedPreferences("cw_cache",Context.MODE_PRIVATE);val bd=sp.getBoolean("border_term",true);val gr=sp.getBoolean("show_gear",true);val g=listOf("0","1","ｱ","ｲ","ｳ","ｴ","ｵ","ｶ","Z","X","#","%");for(id in ids){val v=RemoteViews(c.packageName,R.layout.widget);v.setInt(R.id.root,"setBackgroundResource",if(bd)R.drawable.bg else R.drawable.bg_off);v.setViewVisibility(R.id.gear_t,if(gr)View.VISIBLE else View.GONE);v.setOnClickPendingIntent(R.id.gear_t,ClockWeatherProvider.cfgPi(c));val t=SimpleDateFormat("HH:mm:ss",Locale.getDefault()).format(Date());val ip="${Random.nextInt(10,255)}.${Random.nextInt(0,255)}.${Random.nextInt(0,255)}.${Random.nextInt(1,254)}";val h1=Random.nextInt(4096,65535).toString(16);val h2=Random.nextInt(4096,65535).toString(16);val r1=(1..22).map{g.random()}.joinToString("");val r2=(1..22).map{g.random()}.joinToString("");val b1=(1..28).map{Random.nextInt(0,2)}.joinToString("");val p=Random.nextInt(64,99);v.setTextViewText(R.id.p1,hi("$r1\\nroot@matrix:~# ./exploit.sh --target $ip\\n[$t] BYPASSING ICE FIREWALL... [OK]\\n> -H@CK the PL@NET-\\n[+] INJECTING KERNEL PAYLOAD... $p%\\n[MEM] DUMP 0x$h1:0x$h2 // STACK_VERIFIED\\n$b1\\n$r2\\nroot@matrix:~# █",listOf("-H@CK the PL@NET-","$p%","[OK]","█")));v.setTextViewText(R.id.p2,hi("PLEASE;;ENTER;;PASSWORD__\\nLOAD . %qazWSXedcRFVtgbYHNujmIKol%\\n\\\\...Victim ACCEPTED your CALL...\\nroot@matrix:~# Wake up Dj DiD@S\\n//If victim has coffee [ed happy 100%]\\n///CODEMONKEYSENGAGE...&*&&*&;\\nZXC..<>Ckfkd<>vkvodkskclc...\\n{ VODKA3421D;CODE100 } // NODE:$ip\\n$r1 █",listOf("PLEASE;;ENTER;;PASSWORD__","Wake up Dj DiD@S","100%","█")));v.setTextViewText(R.id.p3,hi("21400 END-EXEC SELECT SUM(QUANT_RECV)\\n21500 IF SQLCODE = 100 -> Knock Knock...\\n21600 MOVE LOC TO RTCODE2 // $ip\\n21700 EXEC SQL CLOSE NEXT_ORDER_LINE\\n21800 ELSE AND ORDER_LINE = :ORL-TABLE\\n21900 ADD QTY-TABLE TO QTY-REQ [0x$h1]\\n22000 PERFORM ORDER-PROC THRU ORDER-EXIT\\n22100 ************************************\\n22200 EXEC SQL COMMIT WORK RELEASE █",listOf("Knock Knock...",ip,"█")));v.setTextViewText(R.id.p4,hi("struct group_info init_groups={.usage=2};\\nint nblocks = (gidsetsize + 1) / BLOCK;\\n// Follow the white rabbit.\\ngroup_info = kmalloc(sizeof(*g), GFP_USER);\\nif (!group_info) return NULL; // 0x$h1\\natomic_set(&group_info->usage, 1);\\ngroup_info->blocks = small_block;\\nEXPORT_SYMBOL(groups_alloc); // $ip\\n$b1 █",listOf("Follow the white rabbit.","GFP_USER","█")));v.setTextViewText(R.id.p5,hi("/* ENCRYPTION : INPROCESS */\\nvar EE = require(events).EventEmitter;\\nthis.options = extend({token:0x$h2});\\n1110011 0110 1110 01101 0110 | $r1\\n0000 1011 10011 01011 1101 | $r2\\n0111001 0100 1011 10000 1010 | [AES-512]\\n1100100 1001 0111 00101 1110 | [VERIFIED]\\nvar EEL = function(emitter, type){}\\n$b1 █",listOf("ENCRYPTION : INPROCESS","this.options","[AES-512]","█")));v.setTextViewText(R.id.p6,hi("Function EncryptCode(inputStr, shift)\\n For i = 1 To Len(inputStr) // PID:${Random.nextInt(1000,9999)}\\n charCode = Asc(Mid(inputStr, i, 1))\\n encryptedStr = encryptedStr & Chr(charCode)\\n Next i // NODE:$ip [ACCESS GRANTED]\\nSub DecryptCode(cipherText, key)\\n return cipherText xor 0x$h1 // 0x$h2\\n$r1\\nroot@matrix:~# [EXIT] █",listOf("EncryptCode","[ACCESS GRANTED]","[EXIT]","█")));v.setTextViewText(R.id.foot,hi("└ [CONSOLES:6/6] [$ip] [$t] [EXEC] ┘",listOf("6/6",ip,"[EXEC]")));val pi=PendingIntent.getBroadcast(c,id,Intent(c,HackerWidgetProvider::class.java).apply{action=AppWidgetManager.ACTION_APPWIDGET_UPDATE;putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,intArrayOf(id))},PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);v.setOnClickPendingIntent(R.id.root,pi);m.updateAppWidget(id,v)}}}')
          EOF
      - name: Write Options & Service
        run: |
          python3 - << 'EOF'
          a=chr(97)+"ndroid"
