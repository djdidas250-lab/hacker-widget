name: Auto-Build Hacker Widget
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Entire Android Project
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/hackerwidget

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HackerWidget"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hackerwidget'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.hackerwidget"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <application android:label="Hacker Terminal Widget">
                  <receiver android:name=".HackerWidgetProvider" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/hacker_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/hacker_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://android.com"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/hacker_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/hacker_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#E6050505"
              android:orientation="vertical"
              android:padding="12dp">
              <TextView
                  android:id="@+id/widget_header"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:fontFamily="monospace"
                  android:text="root@android:~# sys_monitor"
                  android:textColor="#00FF41"
                  android:textSize="13sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/widget_body"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_marginTop="6dp"
                  android:fontFamily="monospace"
                  android:text="[OK] KERNEL ACTIVE\n> TAP TO REFRESH"
                  android:textColor="#00CC33"
                  android:textSize="11sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt
          package com.example.hackerwidget
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.random.Random

          class HackerWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      val views = RemoteViews(context.packageName, R.layout.hacker_widget)
                      val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      val fakeIp = "${Random.nextInt(10, 255)}.${Random.nextInt(0, 255)}.${Random.nextInt(0, 255)}.${Random.nextInt(1, 254)}"
                      val cpuLoad = Random.nextInt(12, 89)
                      views.setTextViewText(R.id.widget_body, "[SYNC] $time UTC\n[NODE] $fakeIp\n[LOAD] CPU $cpuLoad% | MEM OK\n> STATUS: SECURE")
                      val intent = Intent(context, HackerWidgetProvider::class.java).apply {
                          action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, intArrayOf(appWidgetId))
                      }
                      val pendingIntent = PendingIntent.getBroadcast(
                          context, appWidgetId, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_body, pendingIntent)
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HackerWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
