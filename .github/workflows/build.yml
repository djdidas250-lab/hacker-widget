
name: Matrix Dual Widgets
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild Matrix app with clock alarm shortcut
        run: |
          pip install pyyaml

          python3 - <<'PY'
          import urllib.request
          import subprocess
          import yaml

          url = "https://raw.githubusercontent.com/djdidas250-lab/hacker-widget/0ad3901/.github/workflows/build.yml"

          print("Downloading the last verified Matrix workflow...")
          data = urllib.request.urlopen(url).read().decode("utf-8")
          workflow = yaml.safe_load(data)

          steps = workflow["jobs"]["build"]["steps"]

          patch = r'''
          python3 - << 'PATCH'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          permission = '<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>'

          if permission not in xml:
              if '<application' not in xml:
                  raise SystemExit("ERROR: Android application tag not found")
              xml = xml.replace('<application', permission + '<application', 1)
              manifest.write_text(xml)

          provider = Path("app/src/main/java/com/example/hackerwidget/ClockWeatherProvider.kt")
          source = provider.read_text()

          anchor = 'private fun tapPi(c:Context):PendingIntent{'

          helper = (
              'private fun alarmPi(c:Context):PendingIntent{'
              'val i=Intent(android.provider.AlarmClock.ACTION_SET_ALARM).apply{'
              'flags=Intent.FLAG_ACTIVITY_NEW_TASK};'
              'val f=PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE;'
              'return if(Build.VERSION.SDK_INT>=34){'
              'val o=ActivityOptions.makeBasic().setPendingIntentBackgroundActivityStartMode('
              'ActivityOptions.MODE_BACKGROUND_ACTIVITY_START_ALLOWED);'
              'PendingIntent.getActivity(c,96,i,f,o.toBundle())'
              '}else PendingIntent.getActivity(c,96,i,f)}\n'
          )

          if 'private fun alarmPi(c:Context)' not in source:
              if anchor not in source:
                  raise SystemExit("ERROR: Alarm insertion point not found")
              source = source.replace(anchor, helper + anchor, 1)

          old_click = (
              'v.setOnClickPendingIntent(R.id.gear_w,cfgPi(c));'
              'v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));'
          )

          new_click = (
              'v.setOnClickPendingIntent(R.id.gear_w,cfgPi(c));'
              'v.setOnClickPendingIntent(R.id.w_time,alarmPi(c));'
              'v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));'
          )

          if old_click in source:
              source = source.replace(old_click, new_click, 1)
          elif new_click not in source:
              raise SystemExit("ERROR: Clock click insertion point not found")

          provider.write_text(source)
          print("SUCCESS: Clock alarm shortcut added.")
          PATCH
          '''

          build_command = (
              "gradle wrapper --gradle-version 8.5 && "
              "chmod +x gradlew && "
              "./gradlew assembleDebug --no-daemon"
          )

          found_build = False

          for step in steps:
              command = step.get("run")
              if not command:
                  continue

              if build_command in command:
                  command = command.replace(
                      build_command,
                      patch + "\n" + build_command,
                      1
                  )
                  found_build = True

              print("Running:", step.get("name", "Build step"))
              subprocess.run(
                  ["bash", "-e", "-o", "pipefail", "-c", command],
                  check=True
              )

          if not found_build:
              raise SystemExit("ERROR: Could not locate the Gradle build command")

          print("Matrix APK build completed.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
