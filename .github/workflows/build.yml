name: Matrix Widget
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build
        run: |
          mkdir -p app/src/main/{res/{xml,layout,drawable},java/com/example/hackerwidget}
          python3 -c '
          a = "android:"
          w = lambda p, s: open(p, "w").write(s.replace("A_", a))
          w("settings.gradle", "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name=\"MatrixWidget\"\ninclude\":app\"")
          w("build.gradle", "plugins{id \"com.android.application\" version \"8.2.2\" apply false;id \"org.jetbrains.kotlin.android\" version \"1.9.22\" apply false}")
          w("app/build.gradle", "plugins{id \"com.android.application\";id \"org.jetbrains.kotlin.android\"}\nandroid{namespace \"com.example.hackerwidget\";compileSdk 34;defaultConfig{applicationId \"com.example.hackerwidget\";minSdk 26;targetSdk 34;versionCode 1;versionName \"1.0\"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget=\"17\"}}")
          w("app/src/main/AndroidManifest.xml", "<manifest xmlns:android=\"http://android.com\"><application A_label=\"Matrix Terminal\"><receiver A_name=\".HackerWidgetProvider\" A_exported=\"true\"><intent-filter><action A_name=\"android.appwidget.action.APPWIDGET_UPDATE\"/></intent-filter><meta-data A_name=\"android.appwidget.provider\" A_resource=\"@xml/info\"/></receiver></application></manifest>")
          w("app/src/main/res/drawable/bg.xml", "<shape xmlns:android=\"http://android.com\"><solid A_color=\"#F2020502\"/><stroke A_width=\"2dp\" A_color=\"#00FF41\"/><corners A_radius=\"4dp\"/></shape>")
          w("app/src/main/res/xml/info.xml", "<appwidget-provider xmlns:android=\"http://android.com\" A_minWidth=\"180dp\" A_minHeight=\"110dp\" A_updatePeriodMillis=\"1800000\" A_initialLayout=\"@layout/widget\" A_resizeMode=\"horizontal|vertical\" A_widgetCategory=\"home_screen\"/>")
          w("app/src/main/res/layout/widget.xml", "<LinearLayout xmlns:android=\"http://android.com\" A_id=\"@+id/root\" A_layout_width=\"match_parent\" A_layout_height=\"match_parent\" A_background=\"@drawable/bg\" A_orientation=\"vertical\" A_padding=\"12dp\"><TextView A_layout_width=\"match_parent\" A_layout_height=\"wrap_content\" A_fontFamily=\"monospace\" A_text=\"SYS://MATRIX.NET [ONLINE]\" A_color=\"#FFFFFF\" A_textSize=\"12sp\" A_textStyle=\"bold\"/><TextView A_id=\"@+id/body\" A_layout_width=\"match_parent\" A_layout_height=\"match_parent\" A_layout_marginTop=\"6dp\" A_fontFamily=\"monospace\" A_text=\"> TAP TO SYNC\" A_color=\"#00FF41\" A_textSize=\"11sp\"/></LinearLayout>")
          w("app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt", """package com.example.hackerwidget
          import android.app.*;import android.appwidget.*;import android.content.*;import android.graphics.Color;import android.text.*;import android.text.style.ForegroundColorSpan;import android.widget.RemoteViews;import java.text.SimpleDateFormat;import java.util.*;import kotlin.random.Random
          class HackerWidgetProvider:AppWidgetProvider(){override fun onUpdate(c:Context,m:AppWidgetManager,ids:IntArray){val g=listOf("ｱ","ｲ","ｳ","ｴ","ｵ","ｶ","ｷ","ｸ","ｹ","ｺ","0","1","Z","X");for(id in ids){val v=RemoteViews(c.packageName,R.layout.widget);val t=SimpleDateFormat("HH:mm:ss",Locale.getDefault()).format(Date());val ip="${Random.nextInt(10,255)}.${Random.nextInt(0,255)}.${Random.nextInt(0,255)}.${Random.nextInt(1,254)}";val s1=(1..16).map{g.random()}.joinToString(" ");val p=Random.nextInt(14,98);val txt="$s1\n> TIME: $t UTC\n> NODE: $ip\n> TRACE: $p% // ACTIVE";val sp=SpannableString(txt);listOf(t,ip,"$p%","ACTIVE").forEach{w->val i=txt.indexOf(w);if(i>=0)sp.setSpan(ForegroundColorSpan(Color.WHITE),i,i+w.length,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)};v.setTextViewText(R.id.body,sp);val pi=PendingIntent.getBroadcast(c,id,Intent(c,HackerWidgetProvider::class.java).apply{action=AppWidgetManager.ACTION_APPWIDGET_UPDATE;putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,intArrayOf(id))},PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);v.setOnClickPendingIntent(R.id.root,pi);m.updateAppWidget(id,v)}}}""")
          '
          gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: HackerWidget-APK, path: app/build/outputs/apk/debug/app-debug.apk }
