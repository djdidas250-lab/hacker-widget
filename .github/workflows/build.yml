name: Matrix Widget
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build
        run: |
          mkdir -p app/src/main/{res/{xml,layout,drawable},java/com/example/hackerwidget}
          python3 -c '
          import base64
          f = {
            "settings.gradle": "",
            "build.gradle": "cGx1Z2luc3tpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguMi4yIiBhcHBseSBmYWxzZTtpZCAib3JnLmpldGJyYWlucy5rb3RsaW4uYW5kcm9pZCIgdmVyc2lvbiAiMS45LjIyIiBhcHBseSBmYWxzZX0=",
            "app/build.gradle": "",
            "app/src/main/AndroidManifest.xml": "",
            "app/src/main/res/drawable/bg.xml": "PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiNGMjAyMDUwMiIvPjxzdHJva2UgYW5kcm9pZDp3aWR0aD0iMmRwIiBhbmRyb2lkOmNvbG9yPSIjMDBGRjQxIi8+PGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjRkcCIvPjwvc2hhcGU+",
            "app/src/main/res/xml/info.xml": "",
            "app/src/main/res/layout/widget.xml": "",
            "app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt": ""
          }
          for p, d in f.items(): open(p, "wb").write(base64.b64decode(d))
          '
          gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: HackerWidget-APK, path: app/build/outputs/apk/debug/app-debug.apk }
