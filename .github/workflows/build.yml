name: Matrix Widget
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          mkdir -p app/src/main/{res/{xml,layout,drawable,anim},java/com/example/hackerwidget}
          python3 - << 'EOF'
          import zlib, base64
          a = chr(97) + "ndroid"
          L, G, Q = chr(60), chr(62), chr(34)
          ns = f'xmlns:{a}={Q}http://schemas.{a}.com/apk/res/{a}{Q}'
          def w(p, s):
              open(p, "w").write(s.replace("@A@", a + ":").replace("@a@", a))
          w("settings.gradle", 'pluginManagement{repositories{google();mavenCentral()}}\ndependencyResolutionManagement{repositories{google();mavenCentral()}}\nrootProject.name="MatrixWidget"\ninclude ":app"')
          w("build.gradle", 'plugins{id "com.@a@.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.@a@" version "1.9.22" apply false}')
          w("app/build.gradle", 'plugins{id "com.@a@.application";id "org.jetbrains.kotlin.@a@"}\n@a@{namespace "com.example.hackerwidget";compileSdk 34;defaultConfig{applicationId "com.example.hackerwidget";minSdk 26;targetSdk 34;versionCode 1;versionName "1.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}}')
          w("app/src/main/AndroidManifest.xml", f'{L}manifest {ns}{G}{L}application @A@label={Q}Entering the Matrix{Q}{G}{L}receiver @A@name={Q}.HackerWidgetProvider{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.appwidget.action.APPWIDGET_UPDATE{Q}/{G}{L}/intent-filter{G}{L}meta-data @A@name={Q}@a@.appwidget.provider{Q} @A@resource={Q}@xml/info{Q}/{G}{L}/receiver{G}{L}/application{G}{L}/manifest{G}')
          w("app/src/main/res/drawable/bg.xml", f'{L}layer-list {ns}{G}{L}item{G}{L}shape{G}{L}solid @A@color={Q}#FA010401{Q}/{G}{L}stroke @A@width={Q}2dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}item @A@top={Q}4dp{Q} @A@bottom={Q}4dp{Q} @A@left={Q}4dp{Q} @A@right={Q}4dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#00000000{Q}/{G}{L}stroke @A@width={Q}1dp{Q} @A@color={Q}#5500FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/ring.xml", f'{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}ring{Q} @A@innerRadiusRatio={Q}2.5{Q} @A@thicknessRatio={Q}12{Q} @A@useLevel={Q}false{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#0000FF41{Q} @A@centerColor={Q}#00FF41{Q} @A@endColor={Q}#FFFFFF{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}')
          w("app/src/main/res/drawable/bar.xml", f'{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#00FF41{Q} @A@centerColor={Q}#FFFFFF{Q} @A@endColor={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}')
          w("app/src/main/res/anim/in_u.xml", f'{L}translate {ns} @A@duration={Q}180{Q} @A@fromYDelta={Q}100%{Q} @A@toYDelta={Q}0%{Q}/{G}')
          w("app/src/main/res/anim/out_u.xml", f'{L}translate {ns} @A@duration={Q}180{Q} @A@fromYDelta={Q}0%{Q} @A@toYDelta={Q}-100%{Q}/{G}')
          w("app/src/main/res/xml/info.xml", f'{L}appwidget-provider {ns} @A@minWidth={Q}180dp{Q} @A@minHeight={Q}160dp{Q} @A@updatePeriodMillis={Q}1800000{Q} @A@initialLayout={Q}@layout/widget{Q} @A@resizeMode={Q}horizontal|vertical{Q} @A@widgetCategory={Q}home_screen{Q}/{G}')
          tvs = "".join([f'{L}TextView @A@id={Q}@+id/p{i}{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@fontFamily={Q}monospace{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}9.5sp{Q}/{G}' for i in range(1,7)])
          w("app/src/main/res/layout/widget.xml", f'{L}LinearLayout {ns} @A@id={Q}@+id/root{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@background={Q}@drawable/bg{Q} @A@orientation={Q}vertical{Q} @A@padding={Q}10dp{Q}{G}{L}LinearLayout @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@gravity={Q}center_vertical{Q}{G}{L}ProgressBar @A@layout_width={Q}24dp{Q} @A@layout_height={Q}24dp{Q} @A@indeterminateDrawable={Q}@drawable/ring{Q}/{G}{L}TextView @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginStart={Q}8dp{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}Entering the Matrix{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}13sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}/LinearLayout{G}{L}TextView @A@id={Q}@+id/init{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginTop={Q}4dp{Q} @A@fontFamily={Q}monospace{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}9sp{Q}/{G}{L}ProgressBar @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}6dp{Q} @A@layout_marginTop={Q}2dp{Q} @A@indeterminateDrawable={Q}@drawable/bar{Q}/{G}{L}ViewFlipper @A@id={Q}@+id/f{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@layout_marginTop={Q}5dp{Q} @A@autoStart={Q}true{Q} @A@flipInterval={Q}1750{Q} @A@inAnimation={Q}@anim/in_u{Q} @A@outAnimation={Q}@anim/out_u{Q}{G}{tvs}{L}/ViewFlipper{G}{L}/LinearLayout{G}')
          w("app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt", 'package com.example.hackerwidget\nimport @a@.app.*;import @a@.appwidget.*;import @a@.content.*;import @a@.graphics.Color;import @a@.text.*;import @a@.text.style.ForegroundColorSpan;import @a@.widget.RemoteViews;import java.text.SimpleDateFormat;import java.util.*;import kotlin.random.Random\nclass HackerWidgetProvider:AppWidgetProvider(){private fun hi(s:String,w:List<String>):SpannableString{val sp=SpannableString(s);w.forEach{k->val i=s.indexOf(k);if(i>=0)sp.setSpan(ForegroundColorSpan(Color.WHITE),i,i+k.length,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)};return sp}\noverride fun onUpdate(c:Context,m:AppWidgetManager,ids:IntArray){val g=listOf("0","1","ｱ","ｲ","ｳ","ｴ","ｵ","ｶ","Z","X","#","%");for(id in ids){val v=RemoteViews(c.packageName,R.layout.widget);val t=SimpleDateFormat("HH:mm:ss",Locale.getDefault()).format(Date());val ip="${Random.nextInt(10,255)}.${Random.nextInt(0,255)}.${Random.nextInt(0,255)}.${Random.nextInt(1,254)}";fun h()=Random.nextInt(4096,65535).toString(16);fun r()=(1..16).map{g.random()}.joinToString("");val p=Random.nextInt(64,99);v.setTextViewText(R.id.init,hi("System initialization... $p%  [$t]",listOf("$p%",t)));v.setTextViewText(R.id.p1,hi("root@matrix:~# ./exploit.sh --target $ip\\n[$t] PAYLOAD INJECTED $p% [OK]\\n> -H@CK the PL@NET-\\n[MEM] DUMP 0x${h()}:0x${h()} █",listOf("-H@CK the PL@NET-","$p%","█")));v.setTextViewText(R.id.p2,hi("PLEASE;;\'ENTER;;\'PASSWORD__\\nLOAD . %qazWSXedcRFVtgbYHNujmIKol%\\nroot@matrix:~# Wake up Dj DiD@S\\n///CODEMONKEYSENGAGE... [100%] █",listOf("PLEASE;;\'ENTER;;\'PASSWORD__","Wake up Dj DiD@S","100%","█")));v.setTextViewText(R.id.p3,hi("21400 END-EXEC SELECT SUM(QUANT_RECV)\\n21500 IF SQLCODE = 100 -> Knock Knock...\\n21600 MOVE LOC TO RTCODE2 // $ip\\n21700 PERFORM ORDER-PROC THRU ORDER █",listOf("Knock Knock...",ip,"█")));v.setTextViewText(R.id.p4,hi("struct group_info init_groups={.usage=2};\\n// Follow the white rabbit.\\ngroup_info = kmalloc(sizeof(*g), GFP_USER);\\nEXPORT_SYMBOL(groups_alloc); // 0x${h()} █",listOf("Follow the white rabbit.","GFP_USER","█")));v.setTextViewText(R.id.p5,hi("/* ENCRYPTION : INPROCESS */\\nvar EE = require(\'events\').EventEmitter;\\nthis.options = extend({token:0x${h()}});\\n1110011 0110 1110 01101 | ${r()} █",listOf("ENCRYPTION : INPROCESS","this.options","█")));v.setTextViewText(R.id.p6,hi("Function EncryptCode(inputStr, shift)\\n For i = 1 To Len(inputStr) // PID:${Random.nextInt(1000,9999)}\\n charCode = Asc(Mid(inputStr, i, 1))\\n Next i // NODE:$ip [EXIT] █",listOf("EncryptCode","[EXIT]","█")));val pi=PendingIntent.getBroadcast(c,id,Intent(c,HackerWidgetProvider::class.java).apply{action=AppWidgetManager.ACTION_APPWIDGET_UPDATE;putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,intArrayOf(id))},PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);v.setOnClickPendingIntent(R.id.root,pi);m.updateAppWidget(id,v)}}}')
          EOF
          gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HackerWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
