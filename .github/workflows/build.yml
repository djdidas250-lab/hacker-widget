
name: Matrix Dual Widgets - Final Visual Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply final design and build APK
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import yaml

          print("Loading the previous working Matrix workflow...")
          previous = subprocess.check_output(
              [
                  "git", "show",
                  os.environ["GITHUB_SHA"] + "^:.github/workflows/build.yml"
              ],
              text=True
          )

          config = yaml.safe_load(previous)
          steps = config["jobs"]["build"]["steps"]

          target = None
          for step in steps:
              if step.get("name") == "Generate futuristic random hacker hub and build APK":
                  target = step
                  break

          if target is None:
              raise SystemExit(
                  "ERROR: Previous Matrix build workflow was not found."
              )

          run_script = target["run"]

          # Make every terminal title bar charcoal with white lettering.
          run_script, count = re.subn(
              r'header_colors = \[.*?\n\s+\]',
              'header_colors = [("#20272D", "#FFFFFF")]',
              run_script,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit("ERROR: Could not update terminal title colors.")

          # Add white Linux-style window controls to every terminal title.
          run_script = run_script.replace(
              'android:text="{title_xml}"',
              'android:text="{title_xml}   — □ ×"'
          )

          # Make the terminal panel outlines gunmetal instead of green.
          run_script = run_script.replace(
              '<stroke android:width="1dp" android:color="#00FF41"/>',
              '<stroke android:width="1dp" android:color="#59616A"/>'
          )

          # Add the narrow charcoal strip behind the top header only.
          run_script, count = re.subn(
              r'android:layout_height="23dp"(\s+)android:gravity="center_vertical"',
              'android:layout_height="23dp"\\1android:background="#20272D"\\1android:gravity="center_vertical"',
              run_script,
              count=1
          )
          if count != 1:
              raise SystemExit("ERROR: Could not locate the widget header.")

          # Keep the spinner centered and safely inside the header.
          run_script = run_script.replace(
              'android:layout_marginTop="5dp"',
              'android:layout_marginTop="0dp"',
              1
          )

          # Give the outer widget and clock/weather frame metallic borders.
          ring_patch = r'''
          # Use a two-tone segmented green-and-white rotating ring.
          from pathlib import Path

          Path("app/src/main/res/drawable/ring_segments.xml").write_text("""
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#00FF41"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round"
                  android:pathData="M12,2 A10,10 0 0 1 22,12"/>
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round"
                  android:pathData="M12,22 A10,10 0 0 1 2,12"/>
          </vector>
          """)

          Path("app/src/main/res/drawable/ring.xml").write_text("""
          <animated-rotate
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/ring_segments"
              android:pivotX="50%"
              android:pivotY="50%"
              android:framesCount="24"
              android:frameDuration="40"/>
          """)

          # Replace green outer outlines with subtle gunmetal gray.
          for filename in ("bg.xml", "sbg.xml"):
              drawable = Path("app/src/main/res/drawable") / filename
              if drawable.exists():
                  content = drawable.read_text()
                  content = content.replace("#00FF41", "#59616A")
                  content = content.replace("#6600FF41", "#6659616A")
                  drawable.write_text(content)
          '''

          needle = "# Preserve the working clock-to-alarm shortcut."
          if needle not in run_script:
              raise SystemExit("ERROR: Could not locate the original setup section.")

          run_script = run_script.replace(
              needle,
              ring_patch + "\n              " + needle,
              1
          )

          # Make only the word LIVE white. Brackets and all other footer
          # wording remain neon green.
          footer_patch = r'''
                              val footerText = android.text.SpannableString(
                                  "[ LIVE ] VIRTUAL GRID // ENCRYPTED CHANNEL"
                              )
                              val liveStart = footerText.indexOf("LIVE")
                              footerText.setSpan(
                                  android.text.style.ForegroundColorSpan(
                                      android.graphics.Color.WHITE
                                  ),
                                  liveStart,
                                  liveStart + 4,
                                  android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                              )
                              views.setTextViewText(R.id.foot, footerText)
          '''

          footer_needle = "manager.updateAppWidget(id, views)"
          if footer_needle not in run_script:
              raise SystemExit("ERROR: Could not locate the widget update section.")

          run_script = run_script.replace(
              footer_needle,
              footer_patch + "\n                          " + footer_needle,
              1
          )

          # Run the complete previous build process with the design changes.
          print("Applying the approved Matrix visual design...")
          subprocess.run(
              ["bash", "-e", "-o", "pipefail", "-c", run_script],
              check=True
          )

          print("Matrix build process finished.")
          PY

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
