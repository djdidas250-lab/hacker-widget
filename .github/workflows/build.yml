name: Matrix Dual Widgets
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Base
        run: |
          mkdir -p app/src/main/{res/{xml,layout,drawable,anim},java/com/example/hackerwidget}
          python3 - << 'EOF'
          a=chr(97)+"ndroid"
          L,G,Q=chr(60),chr(62),chr(34)
          ns=f'xmlns:{a}={Q}http://schemas.{a}.com/apk/res/{a}{Q}'
          w=lambda p,s:open(p,"w").write(s.replace("@A@",a+":").replace("@a@",a))
          w("settings.gradle",'pluginManagement{repositories{google();mavenCentral()}}\ndependencyResolutionManagement{repositories{google();mavenCentral()}}\nrootProject.name="MatrixWidget"\ninclude ":app"')
          w("build.gradle",'plugins{id "com.@a@.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.@a@" version "1.9.22" apply false}')
          w("app/build.gradle",'plugins{id "com.@a@.application";id "org.jetbrains.kotlin.@a@"}\n@a@{namespace "com.example.hackerwidget";compileSdk 34;defaultConfig{applicationId "com.example.hackerwidget";minSdk 26;targetSdk 34;versionCode 21;versionName "21.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}}')
          w("app/src/main/AndroidManifest.xml",f'{L}manifest {ns}{G}{L}uses-permission @A@name={Q}@a@.permission.INTERNET{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.ACCESS_NETWORK_STATE{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.ACCESS_COARSE_LOCATION{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.FOREGROUND_SERVICE{Q}/{G}{L}uses-permission @A@name={Q}@a@.permission.FOREGROUND_SERVICE_DATA_SYNC{Q}/{G}{L}application @A@label={Q}Entering the Matrix{Q}{G}{L}activity @A@name={Q}.SyncActivity{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.intent.action.MAIN{Q}/{G}{L}category @A@name={Q}@a@.intent.category.LAUNCHER{Q}/{G}{L}/intent-filter{G}{L}/activity{G}{L}service @A@name={Q}.SyncService{Q} @A@exported={Q}false{Q} @A@foregroundServiceType={Q}dataSync{Q}/{G}{L}receiver @A@name={Q}.HackerWidgetProvider{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.appwidget.action.APPWIDGET_UPDATE{Q}/{G}{L}/intent-filter{G}{L}meta-data @A@name={Q}@a@.appwidget.provider{Q} @A@resource={Q}@xml/info{Q}/{G}{L}/receiver{G}{L}receiver @A@name={Q}.ClockWeatherProvider{Q} @A@exported={Q}true{Q}{G}{L}intent-filter{G}{L}action @A@name={Q}@a@.appwidget.action.APPWIDGET_UPDATE{Q}/{G}{L}action @A@name={Q}com.example.hackerwidget.REFRESH_CW{Q}/{G}{L}/intent-filter{G}{L}meta-data @A@name={Q}@a@.appwidget.provider{Q} @A@resource={Q}@xml/cw_info{Q}/{G}{L}/receiver{G}{L}/application{G}{L}/manifest{G}')
          w("app/src/main/res/drawable/bg.xml",f'{L}layer-list {ns}{G}{L}item @A@top={Q}8dp{Q} @A@bottom={Q}8dp{Q} @A@left={Q}8dp{Q} @A@right={Q}8dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#FA010401{Q}/{G}{L}stroke @A@width={Q}2dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}item @A@top={Q}12dp{Q} @A@bottom={Q}12dp{Q} @A@left={Q}12dp{Q} @A@right={Q}12dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#00000000{Q}/{G}{L}stroke @A@width={Q}1dp{Q} @A@color={Q}#6600FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/sbg.xml",f'{L}layer-list {ns}{G}{L}item @A@top={Q}4dp{Q} @A@bottom={Q}4dp{Q} @A@left={Q}4dp{Q} @A@right={Q}4dp{Q}{G}{L}shape{G}{L}solid @A@color={Q}#FA010401{Q}/{G}{L}stroke @A@width={Q}2dp{Q} @A@color={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/item{G}{L}/layer-list{G}')
          w("app/src/main/res/drawable/ring.xml",f'{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape @A@shape={Q}ring{Q} @A@innerRadiusRatio={Q}2.5{Q} @A@thicknessRatio={Q}12{Q} @A@useLevel={Q}false{Q}{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#0000FF41{Q} @A@centerColor={Q}#00FF41{Q} @A@endColor={Q}#FFFFFF{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}')
          w("app/src/main/res/drawable/bar.xml",f'{L}animated-rotate {ns} @A@pivotX={Q}50%{Q} @A@pivotY={Q}50%{Q}{G}{L}shape{G}{L}gradient @A@type={Q}sweep{Q} @A@startColor={Q}#00FF41{Q} @A@centerColor={Q}#FFFFFF{Q} @A@endColor={Q}#00FF41{Q}/{G}{L}/shape{G}{L}/animated-rotate{G}')
          w("app/src/main/res/anim/in_u.xml",f'{L}translate {ns} @A@duration={Q}180{Q} @A@fromYDelta={Q}100%{Q} @A@toYDelta={Q}0%{Q}/{G}')
          w("app/src/main/res/anim/out_u.xml",f'{L}translate {ns} @A@duration={Q}180{Q} @A@fromYDelta={Q}0%{Q} @A@toYDelta={Q}-100%{Q}/{G}')
          w("app/src/main/res/xml/info.xml",f'{L}appwidget-provider {ns} @A@minWidth={Q}180dp{Q} @A@minHeight={Q}180dp{Q} @A@updatePeriodMillis={Q}1800000{Q} @A@initialLayout={Q}@layout/widget{Q} @A@resizeMode={Q}horizontal|vertical{Q} @A@widgetCategory={Q}home_screen{Q}/{G}')
          w("app/src/main/res/xml/cw_info.xml",f'{L}appwidget-provider {ns} @A@minWidth={Q}220dp{Q} @A@minHeight={Q}70dp{Q} @A@updatePeriodMillis={Q}1800000{Q} @A@initialLayout={Q}@layout/cw_widget{Q} @A@resizeMode={Q}horizontal|vertical{Q} @A@widgetCategory={Q}home_screen{Q}/{G}')
          EOF
      - name: Write Layouts & Terminal
        run: |
          python3 - << 'EOF'
          a=chr(97)+"ndroid"
          L,G,Q=chr(60),chr(62),chr(34)
          ns=f'xmlns:{a}={Q}http://schemas.{a}.com/apk/res/{a}{Q}'
          pcts="".join([f'{L}TextView @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@gravity={Q}center{Q} @A@text={Q}System initialization... {v}%{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}8.5sp{Q}/{G}' for v in ["08","19","34","51","68","83","94","100"]])
          tvs="".join([f'{L}TextView @A@id={Q}@+id/p{i}{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@fontFamily={Q}monospace{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}8.8sp{Q}/{G}' for i in range(1,7)])
          w=lambda p,s:open(p,"w").write(s.replace("@A@",a+":").replace("@a@",a))
          w("app/src/main/res/layout/widget.xml",f'{L}LinearLayout {ns} @A@id={Q}@+id/root{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@background={Q}@drawable/bg{Q} @A@orientation={Q}vertical{Q} @A@padding={Q}17dp{Q}{G}{L}LinearLayout @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@gravity={Q}center_vertical{Q}{G}{L}ProgressBar @A@layout_width={Q}22dp{Q} @A@layout_height={Q}22dp{Q} @A@indeterminateDrawable={Q}@drawable/ring{Q}/{G}{L}TextView @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginStart={Q}7dp{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}┌ Entering the Matrix ┐{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}11.5sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}/LinearLayout{G}{L}ViewFlipper @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginTop={Q}3dp{Q} @A@autoStart={Q}true{Q} @A@flipInterval={Q}300{Q}{G}{pcts}{L}/ViewFlipper{G}{L}ProgressBar @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}5dp{Q} @A@layout_marginTop={Q}2dp{Q} @A@indeterminateDrawable={Q}@drawable/bar{Q}/{G}{L}ViewFlipper @A@id={Q}@+id/f{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}0dp{Q} @A@layout_weight={Q}1{Q} @A@layout_marginTop={Q}4dp{Q} @A@autoStart={Q}true{Q} @A@flipInterval={Q}1750{Q} @A@inAnimation={Q}@anim/in_u{Q} @A@outAnimation={Q}@anim/out_u{Q}{G}{tvs}{L}/ViewFlipper{G}{L}TextView @A@id={Q}@+id/foot{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginTop={Q}2dp{Q} @A@fontFamily={Q}monospace{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}8sp{Q}/{G}{L}/LinearLayout{G}')
          w("app/src/main/res/layout/cw_widget.xml",f'{L}LinearLayout {ns} @A@id={Q}@+id/cw_root{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@background={Q}@drawable/sbg{Q} @A@orientation={Q}horizontal{Q} @A@gravity={Q}center_vertical{Q} @A@padding={Q}12dp{Q}{G}{L}LinearLayout @A@layout_width={Q}0dp{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_weight={Q}1.2{Q} @A@orientation={Q}vertical{Q}{G}{L}TextView @A@id={Q}@+id/w_loc{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}Fort Erie{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}10sp{Q}/{G}{L}TextClock @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@format12Hour={Q}hh:mm{Q} @A@format24Hour={Q}HH:mm{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}28sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}TextClock @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@format12Hour={Q}EEEE, MMMM dd{Q} @A@format24Hour={Q}EEEE, MMMM dd{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}9.5sp{Q}/{G}{L}/LinearLayout{G}{L}LinearLayout @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@orientation={Q}vertical{Q} @A@gravity={Q}end{Q}{G}{L}TextView @A@id={Q}@+id/w_top{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}--° ☁{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}24sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}TextView @A@id={Q}@+id/w_sub{Q} @A@layout_width={Q}wrap_content{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}Tap to sync ≋ --°{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}9.5sp{Q}/{G}{L}/LinearLayout{G}{L}/LinearLayout{G}')
          w("app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.appwidget.*;import @a@.content.*;import @a@.graphics.Color;import @a@.text.*;import @a@.text.style.ForegroundColorSpan;import @a@.widget.RemoteViews;import java.text.SimpleDateFormat;import java.util.*;import kotlin.random.Random\nclass HackerWidgetProvider:AppWidgetProvider(){private fun hi(s:String,w:List<String>):SpannableString{val sp=SpannableString(s);w.forEach{k->val i=s.indexOf(k);if(i>=0)sp.setSpan(ForegroundColorSpan(Color.WHITE),i,i+k.length,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)};return sp}\noverride fun onUpdate(c:Context,m:AppWidgetManager,ids:IntArray){val g=listOf("0","1","ｱ","ｲ","ｳ","ｴ","ｵ","ｶ","Z","X","#","%");for(id in ids){val v=RemoteViews(c.packageName,R.layout.widget);val t=SimpleDateFormat("HH:mm:ss",Locale.getDefault()).format(Date());val ip="${Random.nextInt(10,255)}.${Random.nextInt(0,255)}.${Random.nextInt(0,255)}.${Random.nextInt(1,254)}";val h1=Random.nextInt(4096,65535).toString(16);val h2=Random.nextInt(4096,65535).toString(16);val r1=(1..22).map{g.random()}.joinToString("");val r2=(1..22).map{g.random()}.joinToString("");val b1=(1..28).map{Random.nextInt(0,2)}.joinToString("");val p=Random.nextInt(64,99);v.setTextViewText(R.id.p1,hi("$r1\\nroot@matrix:~# ./exploit.sh --target $ip\\n[$t] BYPASSING ICE FIREWALL... [OK]\\n> -H@CK the PL@NET-\\n[+] INJECTING KERNEL PAYLOAD... $p%\\n[MEM] DUMP 0x$h1:0x$h2 // STACK_VERIFIED\\n$b1\\n$r2\\nroot@matrix:~# █",listOf("-H@CK the PL@NET-","$p%","[OK]","█")));v.setTextViewText(R.id.p2,hi("PLEASE;;ENTER;;PASSWORD__\\nLOAD . %qazWSXedcRFVtgbYHNujmIKol%\\n\\\\...Victim ACCEPTED your CALL...\\nroot@matrix:~# Wake up Dj DiD@S\\n//If victim has coffee [ed happy 100%]\\n///CODEMONKEYSENGAGE...&*&&*&;\\nZXC..<>Ckfkd<>vkvodkskclc...\\n{ VODKA3421D;CODE100 } // NODE:$ip\\n$r1 █",listOf("PLEASE;;ENTER;;PASSWORD__","Wake up Dj DiD@S","100%","█")));v.setTextViewText(R.id.p3,hi("21400 END-EXEC SELECT SUM(QUANT_RECV)\\n21500 IF SQLCODE = 100 -> Knock Knock...\\n21600 MOVE LOC TO RTCODE2 // $ip\\n21700 EXEC SQL CLOSE NEXT_ORDER_LINE\\n21800 ELSE AND ORDER_LINE = :ORL-TABLE\\n21900 ADD QTY-TABLE TO QTY-REQ [0x$h1]\\n22000 PERFORM ORDER-PROC THRU ORDER-EXIT\\n22100 ************************************\\n22200 EXEC SQL COMMIT WORK RELEASE █",listOf("Knock Knock...",ip,"█")));v.setTextViewText(R.id.p4,hi("struct group_info init_groups={.usage=2};\\nint nblocks = (gidsetsize + 1) / BLOCK;\\n// Follow the white rabbit.\\ngroup_info = kmalloc(sizeof(*g), GFP_USER);\\nif (!group_info) return NULL; // 0x$h1\\natomic_set(&group_info->usage, 1);\\ngroup_info->blocks = small_block;\\nEXPORT_SYMBOL(groups_alloc); // $ip\\n$b1 █",listOf("Follow the white rabbit.","GFP_USER","█")));v.setTextViewText(R.id.p5,hi("/* ENCRYPTION : INPROCESS */\\nvar EE = require(events).EventEmitter;\\nthis.options = extend({token:0x$h2});\\n1110011 0110 1110 01101 0110 | $r1\\n0000 1011 10011 01011 1101 | $r2\\n0111001 0100 1011 10000 1010 | [AES-512]\\n1100100 1001 0111 00101 1110 | [VERIFIED]\\nvar EEL = function(emitter, type){}\\n$b1 █",listOf("ENCRYPTION : INPROCESS","this.options","[AES-512]","█")));v.setTextViewText(R.id.p6,hi("Function EncryptCode(inputStr, shift)\\n For i = 1 To Len(inputStr) // PID:${Random.nextInt(1000,9999)}\\n charCode = Asc(Mid(inputStr, i, 1))\\n encryptedStr = encryptedStr & Chr(charCode)\\n Next i // NODE:$ip [ACCESS GRANTED]\\nSub DecryptCode(cipherText, key)\\n return cipherText xor 0x$h1 // 0x$h2\\n$r1\\nroot@matrix:~# [EXIT] █",listOf("EncryptCode","[ACCESS GRANTED]","[EXIT]","█")));v.setTextViewText(R.id.foot,hi("└ [CONSOLES:6/6] [$ip] [$t] [EXEC] ┘",listOf("6/6",ip,"[EXEC]")));val pi=PendingIntent.getBroadcast(c,id,Intent(c,HackerWidgetProvider::class.java).apply{action=AppWidgetManager.ACTION_APPWIDGET_UPDATE;putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,intArrayOf(id))},PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);v.setOnClickPendingIntent(R.id.root,pi);m.updateAppWidget(id,v)}}}')
          EOF
      - name: Write Weather & Build
        run: |
          python3 - << 'EOF'
          a=chr(97)+"ndroid"
          w=lambda p,s:open(p,"w").write(s.replace("@a@",a))
          w("app/src/main/java/com/example/hackerwidget/SyncActivity.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.content.*;import @a@.graphics.Color;import @a@.os.Bundle;import @a@.widget.*;import @a@.view.Gravity\nclass SyncActivity:Activity(){override fun onCreate(b:Bundle?){super.onCreate(b);if(checkSelfPermission(@a@.Manifest.permission.ACCESS_COARSE_LOCATION)!=@a@.content.pm.PackageManager.PERMISSION_GRANTED)requestPermissions(arrayOf(@a@.Manifest.permission.ACCESS_COARSE_LOCATION),1);val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;setBackgroundColor(Color.parseColor("#010401"));setPadding(48,48,48,48)};val tv=TextView(this).apply{text="SYNCING MATRIX WEATHER...";setTextColor(Color.parseColor("#00FF41"));textSize=16f;typeface=@a@.graphics.Typeface.MONOSPACE;gravity=Gravity.CENTER};val btn=Button(this).apply{text="FORCE SYNC NOW";setBackgroundColor(Color.parseColor("#003311"));setTextColor(Color.WHITE)};l.addView(tv);l.addView(btn);setContentView(l);fun runSync(){tv.text="FETCHING LIVE WEATHER...";Thread{val res=ClockWeatherProvider.syncNow(applicationContext);runOnUiThread{tv.text=res}}.start()};btn.setOnClickListener{runSync()};runSync()}}')
          w("app/src/main/java/com/example/hackerwidget/SyncService.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.content.*;import @a@.content.pm.ServiceInfo;import @a@.os.*;\nclass SyncService:Service(){override fun onBind(i:Intent?)=null\noverride fun onStartCommand(i:Intent?,f:Int,id:Int):Int{val nm=getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager;if(Build.VERSION.SDK_INT>=26)nm.createNotificationChannel(NotificationChannel("mw","Matrix Sync",NotificationManager.IMPORTANCE_LOW));val n=(if(Build.VERSION.SDK_INT>=26)Notification.Builder(this,"mw") else Notification.Builder(this)).setContentTitle("Matrix Weather").setContentText("Syncing weather...").setSmallIcon(@a@.R.drawable.ic_popup_sync).build();if(Build.VERSION.SDK_INT>=29)startForeground(1,n,ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC) else startForeground(1,n);Thread{try{ClockWeatherProvider.syncNow(applicationContext)}finally{stopForeground(STOP_FOREGROUND_REMOVE);stopSelf(id)}}.start();return START_NOT_STICKY}}')
          w("app/src/main/java/com/example/hackerwidget/ClockWeatherProvider.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.appwidget.*;import @a@.content.*;import @a@.location.*;import @a@.os.*;import @a@.widget.RemoteViews;import org.json.JSONObject;import java.net.*;import java.util.*\nclass ClockWeatherProvider:AppWidgetProvider(){companion object{private fun tapPi(c:Context):PendingIntent{val i=Intent(c,SyncService::class.java);val f=PendingIntent.FLAG_CANCEL_CURRENT or PendingIntent.FLAG_IMMUTABLE;return if(Build.VERSION.SDK_INT>=26)PendingIntent.getForegroundService(c,99,i,f) else PendingIntent.getService(c,99,i,f)}\nprivate fun raw(u:String,host:String?=null):String{val cn=URL(u).openConnection() as HttpURLConnection;cn.instanceFollowRedirects=true;cn.setRequestProperty("User-Agent","Mozilla/5.0");if(host!=null)cn.setRequestProperty("Host",host);cn.connectTimeout=9000;cn.readTimeout=9000;try{return cn.inputStream.bufferedReader().readText()}finally{cn.disconnect()}}\nprivate fun iconFor(st:String,day:Boolean):String=when{st.contains("Sun",true)||st.contains("Clear",true)->if(day)"☀" else "🌙";st.contains("Partly",true)->if(day)"⛅" else "☁";st.contains("Rain",true)||st.contains("Drizzle",true)||st.contains("Shower",true)->"🌧";st.contains("Snow",true)||st.contains("Flurr",true)->"❄";st.contains("Thunder",true)->"⚡";st.contains("Fog",true)||st.contains("Mist",true)->"🌫";else->"☁"}\nfun syncNow(c:Context):String{val m=AppWidgetManager.getInstance(c);val all=m.getAppWidgetIds(ComponentName(c,ClockWeatherProvider::class.java));val sp=c.getSharedPreferences("cw_cache",Context.MODE_PRIVATE);for(id in all){val v=RemoteViews(c.packageName,R.layout.cw_widget);v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));v.setTextViewText(R.id.w_sub,"Syncing... ≋ --°");m.updateAppWidget(id,v)};var lat=42.90;var lon=-78.93;var city=sp.getString("loc","Fort Erie")?:"Fort Erie";try{val lm=c.getSystemService(Context.LOCATION_SERVICE) as LocationManager;val loc=lm.getLastKnownLocation(LocationManager.PASSIVE_PROVIDER)?:lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)?:lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);if(loc!=null){lat=loc.latitude;lon=loc.longitude;@Suppress("DEPRECATION") val g=Geocoder(c,Locale.getDefault()).getFromLocation(lat,lon,1);if(!g.isNullOrEmpty()){val ct=g.first().locality?:g.first().subAdminArea;if(ct!=null)city=ct}}}catch(_:Exception){};val hr=Calendar.getInstance().get(Calendar.HOUR_OF_DAY);val day=hr in 6..18;var tmp=0;var fl=0;var st="Overcast";var ic=if(day)"⛅" else "☁";var ok=false;var err="NO_DATA";val q="latitude=$lat&longitude=$lon&current=temperature_2m,apparent_temperature,weather_code,is_day&temperature_unit=fahrenheit";for(ep in listOf(Pair("https://open-meteo.com",null),Pair("http://104.21.46","://open-meteo.com"))){if(!ok){try{val s=raw(ep.first,ep.second);if(s.trim().startsWith("{")){val j=JSONObject(s).getJSONObject("current");tmp=j.getDouble("temperature_2m").toInt();fl=j.getDouble("apparent_temperature").toInt();val cd=j.getInt("weather_code");val d2=j.optInt("is_day",if(day)1 else 0)==1;st=when(cd){0->if(d2)"Sunny" else "Clear";1,2->"Partly Cloudy";3->"Overcast";45,48->"Fog";in 51..57->"Drizzle";in 61..67,in 80..82->"Rain";in 71..77,in 85..86->"Snow";in 95..99->"Storm";else->"Overcast"};ic=iconFor(st,d2);ok=true}}catch(e:Exception){err="${e.javaClass.simpleName}: ${e.message}"}}};val topStr=if(ok)"${tmp}° $ic" else sp.getString("top","--° $ic")?:"--° $ic";val subStr=if(ok)"$st ≋ ${fl}°" else err.take(20);if(ok)sp.edit().putString("loc",city).putString("top",topStr).putString("sub",subStr).apply();for(id in all){val v=RemoteViews(c.packageName,R.layout.cw_widget);v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));v.setTextViewText(R.id.w_loc,city);v.setTextViewText(R.id.w_top,topStr);v.setTextViewText(R.id.w_sub,subStr);m.updateAppWidget(id,v)};return if(ok)"SUCCESS: $city $topStr | $subStr" else "FAILED: $err"}\noverride fun onUpdate(c:Context,m:AppWidgetManager,ids:Int