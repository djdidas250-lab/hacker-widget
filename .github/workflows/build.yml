          w("app/src/main/res/xml/info.xml",f"{L}appwidget-provider {ns} @A@minWidth={Q}180dp{Q} @A@minHeight={Q}160dp{Q} @A@updatePeriodMillis={Q}1800000{Q} @A@initialLayout={Q}@layout/widget{Q} @A@resizeMode={Q}horizontal|vertical{Q} @A@widgetCategory={Q}home_screen{Q}/{G}")
          w("app/src/main/res/layout/widget.xml",f"{L}LinearLayout {ns} @A@id={Q}@+id/root{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}match_parent{Q} @A@background={Q}@drawable/bg{Q} @A@orientation={Q}vertical{Q} @A@padding={Q}10dp{Q}{G}{L}LinearLayout @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@orientation={Q}horizontal{Q} @A@gravity={Q}center_vertical{Q}{G}{L}FrameLayout @A@layout_width={Q}26dp{Q} @A@layout_height={Q}26dp{Q}{G}{L}ProgressBar @A@layout_width={Q}26dp{Q} @A@layout_height={Q}26dp{Q} @A@indeterminateDrawable={Q}@drawable/ring1{Q}/{G}{L}ProgressBar @A@layout_width={Q}16dp{Q} @A@layout_height={Q}16dp{Q} @A@layout_gravity={Q}center{Q} @A@indeterminateDrawable={Q}@drawable/ring2{Q}/{G}{L}/FrameLayout{G}{L}LinearLayout @A@layout_width={Q}0dp{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_weight={Q}1{Q} @A@layout_marginStart={Q}8dp{Q} @A@orientation={Q}vertical{Q}{G}{L}TextView @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}Entering the Matrix{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}12.5sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}TextView @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@text={Q}TTY0 // ROOT_SHELL // [ACCESS GRANTED]{Q} @A@textColor={Q}#00FF41{Q} @A@textSize={Q}8sp{Q}/{G}{L}/LinearLayout{G}{L}/LinearLayout{G}{L}LinearLayout @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@layout_marginTop={Q}5dp{Q} @A@background={Q}@drawable/pbox{Q} @A@orientation={Q}vertical{Q} @A@padding={Q}5dp{Q}{G}{L}TextView @A@id={Q}@+id/init_lbl{Q} @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}wrap_content{Q} @A@fontFamily={Q}monospace{Q} @A@gravity={Q}center{Q} @A@text={Q}System initialization... 84%{Q} @A@textColor={Q}#FFFFFF{Q} @A@textSize={Q}9sp{Q} @A@textStyle={Q}bold{Q}/{G}{L}ProgressBar @A@layout_width={Q}match_parent{Q} @A@layout_height={Q}7dp{Q} @A@layout_marginTop=