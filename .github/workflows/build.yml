          w("app/src/main/java/com/example/hackerwidget/SyncActivity.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.appwidget.*;import @a@.content.*;import @a@.graphics.*;import @a@.os.Bundle;import @a@.widget.*;import @a@.view.Gravity\nclass SyncActivity:Activity(){override fun onCreate(b:Bundle?){super.onCreate(b);if(checkSelfPermission(@a@.Manifest.permission.ACCESS_COARSE_LOCATION)!=@a@.content.pm.PackageManager.PERMISSION_GRANTED)requestPermissions(arrayOf(@a@.Manifest.permission.ACCESS_COARSE_LOCATION),1);val sp=getSharedPreferences("cw_cache",MODE_PRIVATE);val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;setBackgroundColor(Color.parseColor("#010401"));setPadding(48,48,48,48)};val tv=TextView(this).apply{text="SYNCING...";setTextColor(Color.parseColor("#00FF41"));textSize=14f;typeface=Typeface.MONOSPACE;gravity=Gravity.CENTER;setPadding(0,0,0,24)};val btn=Button(this).apply{text="FORCE SYNC WEATHER";setBackgroundColor(Color.parseColor("#003311"));setTextColor(Color.WHITE)};val tBtn=Button(this).apply{text=if(sp.getBoolean("border_term",true))"TERMINAL BORDER: ON" else "TERMINAL BORDER: OFF";setBackgroundColor(Color.parseColor("#00220A"));setTextColor(Color.parseColor("#00FF41"))};val wBtn=Button(this).apply{text=if(sp.getBoolean("border_cw",true))"WEATHER BORDER: ON" else "WEATHER BORDER: OFF";setBackgroundColor(Color.parseColor("#00220A"));setTextColor(Color.parseColor("#00FF41"))};val gBtn=Button(this).apply{text=if(sp.getBoolean("show_gear",true))"GEAR ICON: VISIBLE" else "GEAR ICON: HIDDEN";setBackgroundColor(Color.parseColor("#00220A"));setTextColor(Color.parseColor("#00FF41"))};val cLbl=TextView(this).apply{text="CLOCK TEXT SIZE: ${sp.getInt("sc_clk",100)}%";setTextColor(Color.WHITE);typeface=Typeface.MONOSPACE;setPadding(0,24,0,4)};val cBar=SeekBar(this).apply{max=90;progress=sp.getInt("sc_clk",100)-60};val wLbl=TextView(this).apply{text="WEATHER TEXT SIZE: ${sp.getInt("sc_wth",100)}%";setTextColor(Color.WHITE);typeface=Typeface.MONOSPACE;setPadding(0,18,0,4)};val wBar=SeekBar(this).apply{max=90;progress=sp.getInt("sc_wth",100)-60};l.addView(tv);l.addView(btn);l.addView(tBtn);l.addView(wBtn);l.addView(gBtn);l.addView(cLbl);l.addView(cBar);l.addView(wLbl);l.addView(wBar);setContentView(l);fun refreshAll(){val m=AppWidgetManager.getInstance(this);val hIds=m.getAppWidgetIds(ComponentName(this,HackerWidgetProvider::class.java));if(hIds.isNotEmpty())sendBroadcast(Intent(this,HackerWidgetProvider::class.java).apply{action=AppWidgetManager.ACTION_APPWIDGET_UPDATE;putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,hIds)});ClockWeatherProvider.applyCached(applicationContext)};fun runSync(){tv.text="FETCHING LIVE WEATHER...";Thread{val res=ClockWeatherProvider.syncNow(applicationContext);runOnUiThread{tv.text=res}}.start()};btn.setOnClickListener{runSync()};tBtn.setOnClickListener{val nb=!sp.getBoolean("border_term",true);sp.edit().putBoolean("border_term",nb).apply();tBtn.text=if(nb)"TERMINAL BORDER: ON" else "TERMINAL BORDER: OFF";refreshAll()};wBtn.setOnClickListener{val nb=!sp.getBoolean("border_cw",true);sp.edit().putBoolean("border_cw",nb).apply();wBtn.text=if(nb)"WEATHER BORDER: ON" else "WEATHER BORDER: OFF";refreshAll()};gBtn.setOnClickListener{val ng=!sp.getBoolean("show_gear",true);sp.edit().putBoolean("show_gear",ng).apply();gBtn.text=if(ng)"GEAR ICON: VISIBLE" else "GEAR ICON: HIDDEN";refreshAll()};cBar.setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,p:Int,f:Boolean){val v=p+60;cLbl.text="CLOCK TEXT SIZE: $v%";sp.edit().putInt("sc_clk",v).apply();ClockWeatherProvider.applyCached(applicationContext)};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}});wBar.setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,p:Int,f:Boolean){val v=p+60;wLbl.text="WEATHER TEXT SIZE: $v%";sp.edit().putInt("sc_wth",v).apply();ClockWeatherProvider.applyCached(applicationContext)};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}});runSync()}}')
