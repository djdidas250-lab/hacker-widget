          w("app/src/main/java/com/example/hackerwidget/ClockWeatherProvider.kt",'package com.example.hackerwidget\nimport @a@.app.*;import @a@.appwidget.*;import @a@.content.*;import @a@.location.*;import @a@.os.*;import @a@.util.TypedValue;import @a@.view.View;import @a@.widget.RemoteViews;import org.json.JSONObject;import java.net.*;import java.util.*;import javax.net.ssl.*\nclass ClockWeatherProvider:AppWidgetProvider(){companion object{fun cfgPi(c:Context):PendingIntent{val i=Intent(c,SyncActivity::class.java).apply{flags=Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP};val f=PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE;return if(Build.VERSION.SDK_INT>=34){val o=ActivityOptions.makeBasic().setPendingIntentBackgroundActivityStartMode(ActivityOptions.MODE_BACKGROUND_ACTIVITY_START_ALLOWED);PendingIntent.getActivity(c,95,i,f,o.toBundle())}else PendingIntent.getActivity(c,95,i,f)}\nprivate fun tapPi(c:Context):PendingIntent{val i=Intent(c,SyncService::class.java);val f=PendingIntent.FLAG_CANCEL_CURRENT or PendingIntent.FLAG_IMMUTABLE;return if(Build.VERSION.SDK_INT>=26)PendingIntent.getForegroundService(c,99,i,f) else PendingIntent.getService(c,99,i,f)}\nprivate fun raw(u:String,sni:String?=null):String{System.setProperty("sun.net.http.allowRestrictedHeaders","true");val cn=URL(u).openConnection() as HttpURLConnection;if(sni!=null&&cn is HttpsURLConnection){val base=SSLSocketFactory.getDefault() as SSLSocketFactory;cn.sslSocketFactory=object:SSLSocketFactory(){override fun getDefaultCipherSuites()=base.defaultCipherSuites;override fun getSupportedCipherSuites()=base.supportedCipherSuites;override fun createSocket(s:Socket,h:String,p:Int,ac:Boolean)=(base.createSocket(s,sni,p,ac) as SSLSocket).apply{sslParameters=sslParameters.apply{serverNames=listOf(SNIHostName(sni))}};override fun createSocket(h:String,p:Int)=base.createSocket(h,p);override fun createSocket(h:String,p:Int,lh:InetAddress,lp:Int)=base.createSocket(h,p,lh,lp);override fun createSocket(h:InetAddress,p:Int)=base.createSocket(h,p);override fun createSocket(h:InetAddress,p:Int,lh:InetAddress,lp:Int)=base.createSocket(h,p,lh,lp)};cn.hostnameVerifier=HostnameVerifier{_,ses->HttpsURLConnection.getDefaultHostnameVerifier().verify(sni,ses)};cn.setRequestProperty("Host",sni)};cn.instanceFollowRedirects=true;cn.setRequestProperty("User-Agent","Mozilla/5.0");cn.setRequestProperty("Accept","application/dns-json, application/json, */*");cn.connectTimeout=9000;cn.readTimeout=9000;try{return cn.inputStream.bufferedReader().readText()}finally{cn.disconnect()}}\nprivate fun dohIp(domain:String):String?{for(u in listOf("@H@@D1@/dns-query?name=$domain&type=A","@H@@D2@/resolve?name=$domain&type=A")){try{val j=JSONObject(raw(u));val ans=j.optJSONArray("Answer");if(ans!=null){for(k in 0 until ans.length()){val o=ans.getJSONObject(k);if(o.optInt("type")==1)return o.getString("data")}}}catch(_:Exception){}};return null}\nprivate fun iconFor(st:String,day:Boolean):String=when{st.contains("Sun",true)||st.contains("Clear",true)->if(day)"☀" else "🌙";st.contains("Partly",true)->if(day)"⛅" else "☁";st.contains("Rain",true)||st.contains("Drizzle",true)||st.contains("Shower",true)->"🌧";st.contains("Snow",true)||st.contains("Flurr",true)->"❄";st.contains("Thunder",true)->"⚡";st.contains("Fog",true)||st.contains("Mist",true)->"🌫";else->"☁"}\nprivate fun styleW(c:Context,sp:SharedPreferences,v:RemoteViews){val bd=sp.getBoolean("border_cw",true);val gr=sp.getBoolean("show_gear",true);val cs=sp.getInt("sc_clk",100)/100f;val ws=sp.getInt("sc_wth",100)/100f;v.setInt(R.id.cw_root,"setBackgroundResource",if(bd)R.drawable.sbg else R.drawable.sbg_off);v.setViewVisibility(R.id.gear_w,if(gr)View.VISIBLE else View.GONE);v.setOnClickPendingIntent(R.id.gear_w,cfgPi(c));v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));v.setTextViewTextSize(R.id.w_loc,TypedValue.COMPLEX_UNIT_SP,10f*cs);v.setTextViewTextSize(R.id.w_time,TypedValue.COMPLEX_UNIT_SP,28f*cs);v.setTextViewTextSize(R.id.w_date,TypedValue.COMPLEX_UNIT_SP,9.5f*cs);v.setTextViewTextSize(R.id.w_top,TypedValue.COMPLEX_UNIT_SP,24f*ws);v.setTextViewTextSize(R.id.w_sub,TypedValue.COMPLEX_UNIT_SP,9.5f*ws)}\nfun applyCached(c:Context){val m=AppWidgetManager.getInstance(c);val all=m.getAppWidgetIds(ComponentName(c,ClockWeatherProvider::class.java));val sp=c.getSharedPreferences("cw_cache",Context.MODE_PRIVATE);val city=sp.getString("loc","Fort Erie")?:"Fort Erie";val top=sp.getString("top","--° ☁")?:"--° ☁";val sub=sp.getString("sub","Tap to sync ≋ --°")?:"Tap to sync ≋ --°";for(id in all){val v=RemoteViews(c.packageName,R.layout.cw_widget);styleW(c,sp,v);v.setTextViewText(R.id.w_loc,city);v.setTextViewText(R.id.w_top,top);v.setTextViewText(R.id.w_sub,sub);m.updateAppWidget(id,v)}}\nfun syncNow(c:Context):String{val m=AppWidgetManager.getInstance(c);val all=m.getAppWidgetIds(ComponentName(c,ClockWeatherProvider::class.java));val sp=c.getSharedPreferences("cw_cache",Context.MODE_PRIVATE);for(id in all){val v=RemoteViews(c.packageName,R.layout.cw_widget);styleW(c,sp,v);v.setTextViewText(R.id.w_sub,"Syncing... ≋ --°");m.updateAppWidget(id,v)};var lat=42.90;var lon=-78.93;var city=sp.getString("loc","Fort Erie")?:"Fort Erie";try{val lm=c.getSystemService(Context.LOCATION_SERVICE) as LocationManager;val loc=lm.getLastKnownLocation(LocationManager.PASSIVE_PROVIDER)?:lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)?:lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);if(loc!=null){lat=loc.latitude;lon=loc.longitude;@Suppress("DEPRECATION") val g=Geocoder(c,Locale.getDefault()).getFromLocation(lat,lon,1);if(!g.isNullOrEmpty()){val ct=g.first().locality?:g.first().subAdminArea;if(ct!=null)city=ct}}}catch(_:Exception){};val hr=Calendar.getInstance().get(Calendar.HOUR_OF_DAY);val day=hr in 6..18;var tmp=0;var fl=0;var st="Overcast";var ic=if(day)"⛅" else "☁";var ok=false;var err="NO_DATA";val q="latitude=$lat&longitude=$lon&current=temperature_2m,apparent_temperature,weather_code,is_day&temperature_unit=fahrenheit";val eps=mutableListOf<Pair<String,String?>>(Pair("@H@@OM@/v1/forecast?$q",null));val ip=dohIp("@OM@");if(ip!=null)eps.add(Pair("@H@$ip/v1/forecast?$q","@OM@"));for(ep in eps){if(!ok){try{val s=raw(ep.first,ep.second);if(s.trim().startsWith("{")){val j=JSONObject(s).getJSONObject("current");tmp=j.getDouble("temperature_2m").toInt();fl=j.getDouble("apparent_temperature").toInt();val cd=j.getInt("weather_code");val d2=j.optInt("is_day",if(day)1 else 0)==1;st=when(cd){0->if(d2)"Sunny" else "Clear";1,2->"Partly Cloudy";3->"Overcast";45,48->"Fog";in 51..57->"Drizzle";in 61..67,in 80..82->"Rain";in 71..77,in 85..86->"Snow";in 95..99->"Storm";else->"Overcast"};ic=iconFor(st,d2);ok=true}}catch(e:Exception){err="${e.javaClass.simpleName}: ${e.message}"}}};val topStr=if(ok)"${tmp}° $ic" else sp.getString("top","--° $ic")?:"--° $ic";val subStr=if(ok)"$st ≋ ${fl}°" else err.take(20);if(ok)sp.edit().putString("loc",city).putString("top",topStr).putString("sub",subStr).apply();for(id in all){val v=RemoteViews(c.packageName,R.layout.cw_widget);styleW(c,sp,v);v.setTextViewText(R.id.w_loc,city);v.setTextViewText(R.id.w_top,topStr);v.setTextViewText(R.id.w_sub,subStr);m.updateAppWidget(id,v)};return if(ok)"SUCCESS: $city $topStr | $subStr" else "FAILED: $err"}}\noverride fun onUpdate(c:Context,m:AppWidgetManager,ids:IntArray){applyCached(c);try{val i=Intent(c,SyncService::class.java);if(Build.VERSION.SDK_INT>=26)c.startForegroundService(i) else c.startService(i)}catch(_:Exception){}}}')
