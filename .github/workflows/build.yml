
name: Matrix Dual Widgets - Random Terminal Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate app, add random animated terminal windows, and build
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml
          python3 - <<'PY'
          import subprocess, urllib.request, yaml, textwrap, random
          from pathlib import Path

          base_url = "https://raw.githubusercontent.com/djdidas250-lab/hacker-widget/0ad3901/.github/workflows/build.yml"
          marker = "gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew assembleDebug --no-daemon"

          print("Downloading the original verified app source...")
          raw = urllib.request.urlopen(base_url, timeout=30).read().decode("utf-8")
          base = yaml.safe_load(raw)
          steps = base["jobs"]["build"]["steps"]
          found_build = False

          for step in steps:
              command = step.get("run")
              if not command:
                  continue

              if marker not in command:
                  print("Running original source step:", step.get("name", "setup"))
                  subprocess.run(["bash", "-e", "-o", "pipefail", "-c", command], check=True)
                  continue

              prefix, suffix = command.split(marker, 1)
              print("Generating original clock, weather, settings, and app sources...")
              subprocess.run(["bash", "-e", "-o", "pipefail", "-c", prefix], check=True)

              settings = Path("settings.gradle")
              if not settings.exists():
                  raise SystemExit("ERROR: settings.gradle was not generated")

              settings_text = settings.read_text()
              if "gradlePluginPortal()" not in settings_text:
                  settings_text = settings_text.replace(
                      "repositories{google();mavenCentral()}",
                      "repositories{google();mavenCentral();gradlePluginPortal()}"
                  )
                  settings.write_text(settings_text)

              if "gradlePluginPortal()" not in settings.read_text():
                  raise SystemExit("ERROR: Could not add Gradle Plugin Portal to pluginManagement repositories")

              print("Gradle Plugin Portal enabled for Kotlin plugin resolution.")

              manifest = Path("app/src/main/AndroidManifest.xml")
              mx = manifest.read_text()
              perm = '<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>'
              if perm not in mx:
                  mx = mx.replace('<application', perm + '<application', 1)
                  manifest.write_text(mx)

              provider = Path("app/src/main/java/com/example/hackerwidget/ClockWeatherProvider.kt")
              src = provider.read_text()
              anchor = 'private fun tapPi(c:Context):PendingIntent{'
              helper = ('private fun alarmPi(c:Context):PendingIntent{' \
                'val i=Intent(android.provider.AlarmClock.ACTION_SET_ALARM).apply{' \
                'flags=Intent.FLAG_ACTIVITY_NEW_TASK};' \
                'val f=PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE;' \
                'return if(Build.VERSION.SDK_INT>=34){' \
                'val o=ActivityOptions.makeBasic().setPendingIntentBackgroundActivityStartMode(' \
                'ActivityOptions.MODE_BACKGROUND_ACTIVITY_START_ALLOWED);' \
                'PendingIntent.getActivity(c,96,i,f,o.toBundle())' \
                '}else PendingIntent.getActivity(c,96,i,f)}\n')

              if 'private fun alarmPi(c:Context)' not in src:
                  if anchor not in src:
                      raise SystemExit("ERROR: Could not find clock alarm insertion point")
                  src = src.replace(anchor, helper + anchor, 1)

              old_click = ('v.setOnClickPendingIntent(R.id.gear_w,cfgPi(c));'
                           'v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));')
              new_click = ('v.setOnClickPendingIntent(R.id.gear_w,cfgPi(c));'
                           'v.setOnClickPendingIntent(R.id.w_time,alarmPi(c));'
                           'v.setOnClickPendingIntent(R.id.cw_root,tapPi(c));')

              if old_click in src:
                  src = src.replace(old_click, new_click, 1)
              elif new_click not in src:
                  raise SystemExit("ERROR: Could not find clock click insertion point")

              provider.write_text(src)

              ns = 'xmlns:android="http://schemas.android.com/apk/res/android"'

              def panel(title, body, gravity, margin):
                  return f'''<FrameLayout android:layout_width="match_parent" android:layout_height="match_parent" android:clipChildren="true" android:clipToPadding="true">
                    <LinearLayout android:layout_width="124dp" android:layout_height="wrap_content" android:layout_gravity="{gravity}" android:layout_margin="6dp" android:orientation="vertical" android:padding="3dp" android:background="@drawable/terminal_panel">
                      <TextView android:layout_width="match_parent" android:layout_height="15dp" android:gravity="center_vertical" android:paddingStart="4dp" android:background="@drawable/terminal_header" android:text="{title}" android:textColor="#001A08" android:textStyle="bold" android:textSize="7sp" android:fontFamily="monospace" />
                      <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="3dp" android:text="{body}" android:textColor="#00FF41" android:textSize="7sp" android:maxLines="3" android:fontFamily="monospace" />
                      <ProgressBar style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="3dp" android:indeterminate="true" android:indeterminateTint="#00FF41" android:indeterminateTintMode="src_in" />
                    </LinearLayout>
                  </FrameLayout>'''

              def flipper(fid, interval, margin, groups, repeats):
                  positions = ['top|start', 'top|end', 'center', 'bottom|start', 'bottom|end', 'center_vertical|start', 'center_vertical|end']
                  children = ['<FrameLayout android:layout_width="match_parent" android:layout_height="match_parent" android:clipChildren="true" android:clipToPadding="true" />']

                  for title, body in groups:
                      gravity = random.choice(positions)
                      for _ in range(repeats):
                          children.append(panel(title, body, gravity, margin))
                      children.append('<FrameLayout android:layout_width="match_parent" android:layout_height="match_parent" android:clipChildren="true" android:clipToPadding="true" />')

                  return (f'<ViewFlipper android:id="@+id/{fid}" android:layout_width="match_parent" '
                          f'android:layout_height="match_parent" android:autoStart="true" android:clipChildren="true" android:clipToPadding="true" '
                          f'android:flipInterval="{interval}" android:inAnimation="@anim/panel_in" '
                          f'android:outAnimation="@anim/panel_out">' + ''.join(children) + '</ViewFlipper>')

              short_entries = [
                ("AUTH / SCAN", "[+] scanning ports\\nnode: 10.0.4.21\\ntrace route: active"),
                ("KERNEL TASK", "injecting module...\\nchecksum verified\\nprogress sequence: 42%"),
              ]

              medium_entries = [
                ("FIREWALL / BYPASS", "root@matrix:~# bypass\\n[OK] handshake accepted\\npacket stream active"),
                ("MEMORY DUMP", "0x7F2A -> 0x91BC\\nstack verified\\nreading sectors..."),
                ("ENCRYPTION", "AES session running\\nkey exchange accepted\\nrotating cipher..."),
              ]

              long_entries = [
                ("SYSTEM / OVERRIDE", "root@matrix:~# ./override\\n[+] access granted\\nloading kernel payload..."),
                ("DATA / EXTRACT", "sector 04: reading\\nsector 05: verified\\ntransfer in progress..."),
                ("NETWORK / TRACE", "route mapped: 8 hops\\nproxy chain active\\nconnection stable"),
              ]

              content = flipper('short_windows', 2200, '3dp', short_entries, 3)
              content += flipper('medium_windows', 2450, '0dp', medium_entries, 5)
              content += flipper('long_windows', 2850, '3dp', long_entries, 8)

              layout = f'''<?xml version="1.0" encoding="utf-8"?>
              <LinearLayout {ns} android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="9dp" android:background="@drawable/bg">
                <LinearLayout android:layout_width="match_parent" android:layout_height="23dp" android:gravity="center_vertical" android:orientation="horizontal">
                  <ProgressBar android:layout_width="17dp" android:layout_height="17dp" android:layout_marginStart="6dp" android:layout_marginTop="0dp" android:indeterminate="true" android:indeterminateDrawable="@drawable/ring" />
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="6dp" android:text="MATRIX // LIVE PROCESSES" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="9sp" android:fontFamily="monospace" />
                  <TextView android:id="@+id/gear_t" android:layout_width="wrap_content" android:layout_height="wrap_content" android:paddingStart="5dp" android:text="⚙" android:textColor="#8800FF41" android:textSize="13sp" />
                </LinearLayout>
                <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:padding="5dp" android:clipChildren="true" android:clipToPadding="true">
                  {content}
                </FrameLayout>
                <LinearLayout android:id="@+id/foot" android:layout_width="match_parent" android:layout_height="13dp" android:layout_marginBottom="2dp" android:paddingStart="6dp" android:gravity="center_vertical" android:orientation="horizontal">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[ " android:textColor="#00FF41" android:textSize="7sp" android:fontFamily="monospace" />
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="LIVE" android:textColor="#FFFFFF" android:textSize="7sp" android:fontFamily="monospace" />
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text=" ] independent processes // encrypted channel" android:textColor="#00FF41" android:textSize="7sp" android:fontFamily="monospace" />
                </LinearLayout>
              </LinearLayout>'''

              Path('app/src/main/res/layout/widget.xml').write_text(layout)

              Path('app/src/main/res/drawable/terminal_panel.xml').write_text(f'''<shape {ns} android:shape="rectangle"><gradient android:angle="90" android:startColor="#C00B2414" android:endColor="#B8020804"/><stroke android:width="1dp" android:color="#00FF41"/><corners android:radius="2dp"/></shape>''')

              Path('app/src/main/res/drawable/terminal_header.xml').write_text(f'''<shape {ns} android:shape="rectangle"><solid android:color="#E8FFF0"/></shape>''')

              Path('app/src/main/res/anim/panel_in.xml').write_text(f'''<set {ns} android:duration="320"><alpha android:fromAlpha="0.0" android:toAlpha="1.0"/><translate android:fromYDelta="8%" android:toYDelta="0%"/></set>''')

              Path('app/src/main/res/anim/panel_out.xml').write_text(f'''<set {ns} android:duration="260"><alpha android:fromAlpha="1.0" android:toAlpha="0.0"/><translate android:fromYDelta="0%" android:toYDelta="-5%"/></set>''')

              kotlin = r'''
              package com.example.hackerwidget
              import android.app.*
              import android.appwidget.*
              import android.content.*
              import android.view.View
              import android.widget.RemoteViews

              class HackerWidgetProvider : AppWidgetProvider() {
                  override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                      val prefs = context.getSharedPreferences("cw_cache", Context.MODE_PRIVATE)
                      val border = prefs.getBoolean("border_term", true)
                      val gear = prefs.getBoolean("show_gear", true)

                      for (id in ids) {
                          val views = RemoteViews(context.packageName, R.layout.widget)
                          views.setInt(R.id.root, "setBackgroundResource", if (border) R.drawable.bg else R.drawable.bg_off)
                          views.setViewVisibility(R.id.gear_t, if (gear) View.VISIBLE else View.GONE)
                          views.setOnClickPendingIntent(R.id.gear_t, ClockWeatherProvider.cfgPi(context))
                          views.setDisplayedChild(R.id.short_windows, kotlin.random.Random.nextInt(0, 9))
                          views.setDisplayedChild(R.id.medium_windows, kotlin.random.Random.nextInt(0, 19))
                          views.setDisplayedChild(R.id.long_windows, kotlin.random.Random.nextInt(0, 28))

                          val refresh = Intent(context, HackerWidgetProvider::class.java).apply {
                              action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                              putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, intArrayOf(id))
                          }

                          val pi = PendingIntent.getBroadcast(
                              context, id, refresh,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )

                          views.setOnClickPendingIntent(R.id.root, pi)
                          manager.updateAppWidget(id, views)
                      }
                  }
              }
              '''

              Path('app/src/main/java/com/example/hackerwidget/HackerWidgetProvider.kt').write_text(textwrap.dedent(kotlin))

              print("Random independent terminal panels installed. Building APK...")
              subprocess.run(["bash", "-e", "-o", "pipefail", "-c", marker + suffix], check=True)
              found_build = True

          if not found_build:
              raise SystemExit("ERROR: Could not locate the original Gradle build command")

          print("Matrix multi-window APK build completed.")
          PY
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
